[workspace]
resolver = "3"
members = ["crates/ipomea-primitives", "crates/ipomea-storage","crates/ipomea-type-definitions"]

[package]
name = "ipomea-blockchain-core"
description = "Ipomea Blockchain is a blockchain that blossoms into the night time."
version = "0.1.0"
edition = "2024"

[dependencies]
fixedstr = {version="0.5.10",features=["serde"]}
openinternetcryptographykeys = "0.2.0"
serde = {version="1.0.228",features=["derive"]}
